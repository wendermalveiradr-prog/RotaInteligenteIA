name: Gerar APK Android
on: [push]
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Instalar dependencias Node
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps
          fi
      - name: Embutir JavaScript e Gerar APK
        run: |
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed --platform android --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res || npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res
          if [ ! -f "android/app/debug.keystore" ]; then
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: RotaInteligenteIA-APK
          path: "**/build/outputs/apk/debug/*.apk"
